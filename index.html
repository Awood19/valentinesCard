<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jills Valentine Card</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- First screen: picture -->
  <div id="cover" onclick="openCard()">
    <img src="photo.jpg" alt="Us">
    <p class="hint">Click anywhere</p>
  </div>

  <!-- Valentine card -->
  <div id="card" class="hidden">
    <div class="card-box">
      <h1>Happy Valentine’s Day Beautiful</h1>

  <p id="question">Will you be mine?</p>

  <div id="buttons">
    <button onclick="sayYes()">Yes Please!!!</button>
    <button onclick="sayNo()" id="noBtn">No I hate you!!!</button>
  </div>

  <p id="response" class="hidden"></p>
</div>

</body>
</html>

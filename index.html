<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jills Valentine Card</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- Top-left cover image -->
  <div id="cover-left">
    <img class="cover-img" src="JMphoto.jpg" alt="Us">
  </div>

  <!-- Top-right cover image -->
  <div id="cover-right">
    <img class="cover-img" src="AWphoto.jpg" alt="Us2">
  </div>

  <!-- Valentine card (hidden initially) -->
  <div id="card" class="hidden">
    <div class="card-box">
      <h1>Jillian you are my best friend and sunshine</h1>
      <p id="question">Will you be my Valentine?</p>
      <div id="buttons">
        <button onclick="sayYes()">Yes Please!!!</button>
        <button onclick="sayNo()" id="noBtn">No I hate you!!!</button>
      </div>
      <p id="response" class="hidden"></p>
    </div>
  </div>

</body>
</html>
